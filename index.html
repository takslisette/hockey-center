
<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hockey Center - NHL</title>

    <!-- Yhdistetään CSS-tiedosto -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sivun yläosa -->
    <header>
        <h1>🏒 Hockey Center</h1>
        <p>Kaikki NHL-joukkueet yhdessä paikassa</p>
    </header>

    <!-- Sivun pääsisältö -->
    <main>
<section>
    <h2>NHL-ottelut</h2>
    <div id="games">
        Ladataan otteluita...
    </div>
</section>
<section>
    <h2>NHL-sarjataulukko</h2>

    <div id="standings">
        Ladataan sarjataulukkoa...
    </div>
</section>
<section>
    <h2>Valitse joukkue</h2>

    <select id="teamSelect">
        <option value="">Valitse NHL-joukkue</option>
    </select>

    <div id="teamSchedule">
        Valitse joukkue nähdäksesi sen otteluohjelman.
    </div>
</section>
        <h2>NHL-joukkueet</h2>

        <!-- Joukkueiden hakukenttä -->
        <div class="search-container">
            <input
                type="text"
                id="teamSearch"
                placeholder="Hae NHL-joukkuetta..."
                aria-label="Hae NHL-joukkuetta"
            >
        </div>

        <!-- Tähän JavaScript lisää joukkueet -->
        <div id="teams">
            Ladataan joukkueita...
        </div>

    </main>

    <!-- Yhdistetään JavaScript-tiedosto -->
    <script src="script.js"></script>

</body>
</html>
